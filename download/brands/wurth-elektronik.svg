  <line x1="48" y1="28" x2="55" y2="28" stroke="#E3001B" stroke-width="1.5"/>
  <circle cx="57" cy="28" r="1.5" fill="#E3001B"/>
  <!-- Würth Elektronik text below -->
  <text x="6" y="52" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1A1A1A" letter-spacing="0.3">Würth Elektronik</text>
