<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="capbody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5d4037"/>
      <stop offset="30%" stop-color="#4e342e"/>
      <stop offset="100%" stop-color="#3e2723"/>
    </linearGradient>
    <linearGradient id="capterm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c0c0c0"/>
      <stop offset="50%" stop-color="#999"/>
      <stop offset="100%" stop-color="#666"/>
    </linearGradient>
    <filter id="capsh" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <ellipse cx="100" cy="155" rx="55" ry="6" fill="#000" opacity="0.08"/>
  <!-- Left terminal -->
  <path d="M 45 75 L 70 75 L 75 80 L 75 120 L 70 125 L 45 125 Z" fill="url(#capterm)" stroke="#777" stroke-width="0.3"/>
  <!-- Right terminal -->
  <path d="M 155 75 L 130 75 L 125 80 L 125 120 L 130 125 L 155 125 Z" fill="url(#capterm)" stroke="#777" stroke-width="0.3"/>
  <!-- Body (tantalum/MLCC, brownish) -->
  <path d="M 70 72 L 130 72 L 138 80 L 138 120 L 130 128 L 70 128 L 62 120 L 62 80 Z" fill="url(#capbody)" stroke="#2e1a0e" stroke-width="0.8"/>
  <!-- Top face -->
  <path d="M 70 72 L 130 72 L 138 80 L 62 80 Z" fill="#5d4037"/>
  <!-- Capacitance value marking -->
  <rect x="85" y="85" width="30" height="20" rx="1" fill="#fff" opacity="0.12"/>
  <text x="100" y="98" font-family="monospace" font-size="8" fill="#ddd" text-anchor="middle" opacity="0.6">100</text>
  <!-- Highlights -->
  <path d="M 64 79 L 71 73 L 129 73 L 136 79 Z" fill="#fff" opacity="0.1"/>
  <rect x="63" y="80" width="2" height="38" fill="#fff" opacity="0.06"/>
  <!-- Polarity marker (+) -->
  <rect x="78" y="72" width="4" height="56" fill="#FFD700" opacity="0.4"/>
</svg>
