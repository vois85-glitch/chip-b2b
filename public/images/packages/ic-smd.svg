<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="smdtop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1e1e"/>
      <stop offset="50%" stop-color="#262626"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="smdside" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#333"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="smdpin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8e8e8"/>
      <stop offset="50%" stop-color="#bbb"/>
      <stop offset="100%" stop-color="#888"/>
    </linearGradient>
    <filter id="smdsh" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="2" dy="5"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <ellipse cx="100" cy="168" rx="60" ry="7" fill="#000" opacity="0.1"/>
  <!-- Left pins (gull-wing) -->
  <g>
    <path d="M 48 70 L 65 70 L 68 76 L 62 76 L 62 78 L 48 78 Z" fill="url(#smdpin)"/>
    <path d="M 48 84 L 65 84 L 68 90 L 62 90 L 62 92 L 48 92 Z" fill="url(#smdpin)"/>
    <path d="M 48 98 L 65 98 L 68 104 L 62 104 L 62 106 L 48 106 Z" fill="url(#smdpin)"/>
    <path d="M 48 112 L 65 112 L 68 118 L 62 118 L 62 120 L 48 120 Z" fill="url(#smdpin)"/>
  </g>
  <!-- Right pins -->
  <g>
    <path d="M 152 70 L 135 70 L 132 76 L 138 76 L 138 78 L 152 78 Z" fill="url(#smdpin)"/>
    <path d="M 152 84 L 135 84 L 132 90 L 138 90 L 138 92 L 152 92 Z" fill="url(#smdpin)"/>
    <path d="M 152 98 L 135 98 L 132 104 L 138 104 L 138 106 L 152 106 Z" fill="url(#smdpin)"/>
    <path d="M 152 112 L 135 112 L 132 118 L 138 118 L 138 120 L 152 120 Z" fill="url(#smdpin)"/>
  </g>
  <!-- Body (isometric) -->
  <path d="M 65 60 L 135 60 L 145 68 L 145 128 L 135 136 L 65 136 L 55 128 L 55 68 Z" fill="url(#smdtop)" stroke="#111" stroke-width="0.8"/>
  <!-- Top face -->
  <path d="M 65 60 L 135 60 L 145 68 L 55 68 Z" fill="#2a2a2a"/>
  <!-- Pin 1 dot -->
  <circle cx="68" cy="72" r="2.5" fill="#555"/>
  <!-- Highlights -->
  <path d="M 57 69 L 66 62 L 134 62 L 143 69 Z" fill="#fff" opacity="0.07"/>
  <path d="M 56 70 L 56 126" stroke="#fff" stroke-width="1.5" opacity="0.05"/>
  <!-- Text -->
  <text x="100" y="100" font-family="monospace" font-size="8" fill="#777" text-anchor="middle" opacity="0.4">SOIC</text>
</svg>
