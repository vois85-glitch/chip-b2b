<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="dipbody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d2d2d"/>
      <stop offset="30%" stop-color="#1a1a1a"/>
      <stop offset="70%" stop-color="#222"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="dipside" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="50%" stop-color="#333"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f5f5"/>
      <stop offset="50%" stop-color="#c0c0c0"/>
      <stop offset="100%" stop-color="#888"/>
    </linearGradient>
    <filter id="dshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="2" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <ellipse cx="100" cy="170" rx="65" ry="8" fill="#000" opacity="0.12"/>
  <!-- Pins (left side, 8 pins) -->
  <g>
    <rect x="40" y="55" width="22" height="4" rx="1" fill="url(#pin)" stroke="#777" stroke-width="0.3"/>
    <rect x="40" y="67" width="22" height="4" rx="1" fill="url(#pin)" stroke="#777" stroke-width="0.3"/>
    <rect x="40" y="79" width="22" height="4" rx="1" fill="url(#pin)" stroke="#777" stroke-width="0.3"/>
    <rect x="40" y="91" width="22" height="4" rx="1" fill="url(#pin)" stroke="#777" stroke-width="0.3"/>
    <rect x="40" y="103" width="22" height="4" rx="1" fill="url(#pin)" stroke="#777" stroke-width="0.3"/>
    <rect x="40" y="115" width="22" height="4" rx="1" fill="url(#pin)" stroke="#777" stroke-width="0.3"/>
    <rect x="40" y="127" width="22" height="4" rx="1" fill="url(#pin)" stroke="#777" stroke-width="0.3"/>
    <rect x="40" y="139" width="22" height="4" rx="1" fill="url(#pin)" stroke="#777" stroke-width="0.3"/>
  </g>
  <!-- Pins (right side, 8 pins) -->
  <g>
    <rect x="138" y="55" width="22" height="4" rx="1" fill="url(#pin)" stroke="#777" stroke-width="0.3"/>
    <rect x="138" y="67" width="22" height="4" rx="1" fill="url(#pin)" stroke="#777" stroke-width="0.3"/>
    <rect x="138" y="79" width="22" height="4" rx="1" fill="url(#pin)" stroke="#777" stroke-width="0.3"/>
    <rect x="138" y="91" width="22" height="4" rx="1" fill="url(#pin)" stroke="#777" stroke-width="0.3"/>
    <rect x="138" y="103" width="22" height="4" rx="1" fill="url(#pin)" stroke="#777" stroke-width="0.3"/>
    <rect x="138" y="115" width="22" height="4" rx="1" fill="url(#pin)" stroke="#777" stroke-width="0.3"/>
    <rect x="138" y="127" width="22" height="4" rx="1" fill="url(#pin)" stroke="#777" stroke-width="0.3"/>
    <rect x="138" y="139" width="22" height="4" rx="1" fill="url(#pin)" stroke="#777" stroke-width="0.3"/>
  </g>
  <!-- Body (3D box with slight perspective) -->
  <path d="M 62 45 L 138 45 L 146 55 L 146 145 L 138 155 L 62 155 L 54 145 L 54 55 Z" fill="url(#dipbody)" stroke="#111" stroke-width="1"/>
  <!-- Top face -->
  <path d="M 62 45 L 138 45 L 146 55 L 54 55 Z" fill="#2a2a2a" opacity="0.8"/>
  <!-- Notch (pin 1 indicator) -->
  <circle cx="100" cy="58" r="6" fill="none" stroke="#555" stroke-width="1"/>
  <circle cx="68" cy="63" r="2" fill="#666"/>
  <!-- Highlight -->
  <path d="M 56 56 L 64 48 L 136 48 L 144 56 Z" fill="#fff" opacity="0.06"/>
  <rect x="56" y="56" width="2" height="88" fill="#fff" opacity="0.04"/>
  <!-- Brand text placeholder -->
  <text x="100" y="100" font-family="monospace" font-size="9" fill="#888" text-anchor="middle" opacity="0.5">IC</text>
</svg>
