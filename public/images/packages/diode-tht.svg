<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8e6c9" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#a5d6a7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#66bb6a" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="lead" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0e0e0"/>
      <stop offset="50%" stop-color="#bdbdbd"/>
      <stop offset="100%" stop-color="#757575"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1b5e20"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="4" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Shadow on ground -->
  <ellipse cx="100" cy="165" rx="70" ry="8" fill="#000" opacity="0.12"/>
  <!-- Left lead -->
  <path d="M 20 95 L 70 95 L 70 105 L 20 105 Z" fill="url(#lead)" stroke="#616161" stroke-width="0.5"/>
  <!-- Right lead -->
  <path d="M 130 95 L 180 95 L 180 105 L 130 105 Z" fill="url(#lead)" stroke="#616161" stroke-width="0.5"/>
  <!-- Glass body (cylinder, isometric) -->
  <ellipse cx="100" cy="85" rx="32" ry="10" fill="url(#glass)" stroke="#4caf50" stroke-width="0.8" opacity="0.95"/>
  <path d="M 68 85 L 68 115 Q 68 125 100 125 Q 132 125 132 115 L 132 85" fill="url(#glass)" stroke="#4caf50" stroke-width="0.8" opacity="0.9"/>
  <ellipse cx="100" cy="115" rx="32" ry="10" fill="#81c784" opacity="0.4"/>
  <!-- Cathode band -->
  <path d="M 118 82 L 118 122 Q 120 125 120 125 L 120 82 Z" fill="url(#band)" opacity="0.85"/>
  <!-- Highlight -->
  <ellipse cx="88" cy="83" rx="18" ry="4" fill="#fff" opacity="0.5"/>
  <!-- Pin markers -->
  <circle cx="20" cy="100" r="2" fill="#424242"/>
  <circle cx="180" cy="100" r="2" fill="#424242"/>
</svg>
