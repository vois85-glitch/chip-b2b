<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="to220body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="40%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#222"/>
    </linearGradient>
    <linearGradient id="to220tab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4d4d4"/>
      <stop offset="50%" stop-color="#a0a0a0"/>
      <stop offset="100%" stop-color="#707070"/>
    </linearGradient>
    <linearGradient id="to220pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0e0e0"/>
      <stop offset="100%" stop-color="#888"/>
    </linearGradient>
    <filter id="tsh" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="2" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <ellipse cx="100" cy="175" rx="55" ry="7" fill="#000" opacity="0.12"/>
  <!-- 3 pins -->
  <rect x="86" y="125" width="4" height="45" rx="0.5" fill="url(#to220pin)" stroke="#666" stroke-width="0.3"/>
  <rect x="98" y="125" width="4" height="45" rx="0.5" fill="url(#to220pin)" stroke="#666" stroke-width="0.3"/>
  <rect x="110" y="125" width="4" height="45" rx="0.5" fill="url(#to220pin)" stroke="#666" stroke-width="0.3"/>
  <!-- Metal tab (heatsink) -->
  <path d="M 70 30 L 130 30 L 135 40 L 135 80 L 130 90 L 70 90 L 65 80 L 65 40 Z" fill="url(#to220tab)" stroke="#888" stroke-width="0.5"/>
  <!-- Tab hole -->
  <circle cx="100" cy="55" r="8" fill="#1a1a1a" stroke="#888" stroke-width="0.5"/>
  <circle cx="100" cy="55" r="5" fill="#444"/>
  <!-- Plastic body -->
  <path d="M 65 85 L 135 85 L 140 95 L 140 130 L 135 135 L 65 135 L 60 130 L 60 95 Z" fill="url(#to220body)" stroke="#0d0d0d" stroke-width="1"/>
  <!-- Top highlight on metal -->
  <path d="M 67 32 L 128 32 L 133 40 L 62 40 Z" fill="#fff" opacity="0.15"/>
  <rect x="66" y="41" width="3" height="46" fill="#fff" opacity="0.1"/>
  <!-- Body highlight -->
  <path d="M 62 87 L 67 85 L 133 85 L 138 87 Z" fill="#fff" opacity="0.05"/>
  <!-- Part number -->
  <text x="100" y="115" font-family="monospace" font-size="8" fill="#666" text-anchor="middle" opacity="0.5">MOSFET</text>
</svg>
