<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="40%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
    <linearGradient id="term" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8e8e8"/>
      <stop offset="100%" stop-color="#999"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="3" dy="5"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <ellipse cx="100" cy="165" rx="65" ry="7" fill="#000" opacity="0.1"/>
  <!-- Left terminal -->
  <rect x="25" y="92" width="45" height="6" rx="1" fill="url(#term)"/>
  <!-- Right terminal -->
  <rect x="130" y="92" width="45" height="6" rx="1" fill="url(#term)"/>
  <!-- Body (isometric box) -->
  <path d="M 70 70 L 130 70 L 145 80 L 145 120 L 130 130 L 70 130 L 55 120 L 55 80 Z" fill="url(#body)" stroke="#0d1b2a" stroke-width="1"/>
  <!-- Top face -->
  <path d="M 70 70 L 130 70 L 145 80 L 55 80 Z" fill="#1a1a3e" opacity="0.6"/>
  <!-- Cathode band -->
  <path d="M 122 72 L 127 72 L 135 80 L 135 128 L 127 130 L 122 130 L 122 72 Z" fill="#c62828" opacity="0.9"/>
  <!-- Highlights -->
  <path d="M 60 82 L 68 75 L 125 75 L 130 82 Z" fill="#fff" opacity="0.08"/>
  <path d="M 57 82 L 57 118" stroke="#fff" stroke-width="1" opacity="0.1"/>
  <!-- Terminal pads -->
  <rect x="22" y="88" width="6" height="14" rx="1" fill="#e0e0e0"/>
  <rect x="172" y="88" width="6" height="14" rx="1" fill="#e0e0e0"/>
</svg>
