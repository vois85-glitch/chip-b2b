<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="sot23body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="50%" stop-color="#262626"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="sot23pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8e8e8"/>
      <stop offset="100%" stop-color="#888"/>
    </linearGradient>
    <filter id="sotsh" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <ellipse cx="100" cy="165" rx="45" ry="6" fill="#000" opacity="0.1"/>
  <!-- Pin 1 (top-left, emitter/source) -->
  <path d="M 55 65 L 75 65 L 78 72 L 72 72 L 72 75 L 55 75 Z" fill="url(#sot23pin)"/>
  <!-- Pin 2 (top-right, collector/drain) -->
  <path d="M 145 65 L 125 65 L 122 72 L 128 72 L 128 75 L 145 75 Z" fill="url(#sot23pin)"/>
  <!-- Pin 3 (bottom-center, base/gate) -->
  <path d="M 90 140 L 110 140 L 110 148 L 108 152 L 92 152 L 90 148 Z" fill="url(#sot23pin)"/>
  <!-- Body (3D half-flat) -->
  <path d="M 70 58 L 130 58 L 140 68 L 140 110 L 130 140 L 70 140 L 60 110 L 60 68 Z" fill="url(#sot23body)" stroke="#0d0d0d" stroke-width="0.8"/>
  <!-- Top face -->
  <path d="M 70 58 L 130 58 L 140 68 L 60 68 Z" fill="#2a2a2a"/>
  <!-- Beveled edge -->
  <path d="M 60 68 L 70 58 L 70 140 L 60 110 Z" fill="#1a1a1a" opacity="0.6"/>
  <path d="M 140 68 L 130 58 L 130 140 L 140 110 Z" fill="#1a1a1a" opacity="0.6"/>
  <!-- Pin 1 marker -->
  <circle cx="73" cy="72" r="1.5" fill="#555"/>
  <!-- Highlight -->
  <path d="M 62 69 L 71 60 L 129 60 L 138 69 Z" fill="#fff" opacity="0.06"/>
  <text x="100" y="100" font-family="monospace" font-size="7" fill="#666" text-anchor="middle" opacity="0.4">SOT-23</text>
</svg>
